<!DOCTYPE html>
<html lang="zh-CN" class="notranslate" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仪表盘 · MemoryAgent</title>
<script src="https://cdn.bootcdn.net/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>if(typeof Chart==='undefined'){document.write('<script src="https://cdn.jsdelivr.net/npm/chart.js@4"><\/script>')}</script>
<style>
  :root {
    --bg: #eff1f3;
    --surface: #ffffff;
    --surface2: #f7f8fa;
    --border: #dde0e4;
    --border-light: #e8eaed;
    --text: #1a1a2e;
    --text-dim: #555570;
    --text-muted: #8a8a9a;
    --accent: #8b5cf6;
    --accent-hover: #7c3aed;
    --accent-soft: #8b5cf612;
    --green: #10b981;
    --amber: #f59e0b;
    --red: #ef4444;
    --hover: rgba(0,0,0,0.04);
    --radius: 8px;
    --radius-lg: 12px;
    --shadow: 0 1px 2px rgba(0,0,0,0.04);
    --pref: #8b5cf6; --fact: #22c55e; --goal: #06b6d4;
    --decision: #a855f7; --obs: #f59e0b; --action: #a78bfa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, 'Inter', 'Segoe UI', sans-serif;
    min-height: 100vh;
  }

  /* ── Navigation ── */
  .nav {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 32px; background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .nav h1 { font-size: 18px; font-weight: 600; }
  .nav h1 span { color: var(--accent); }
  .nav .spacer { flex: 1; }
  .nav select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; font-size: 13px;
    outline: none; cursor: pointer;
  }
  .nav .links { display: flex; gap: 6px; }
  .nav .links a {
    color: var(--text-dim); text-decoration: none; font-size: 13px;
    padding: 5px 12px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface);
    transition: all 0.12s;
  }
  .nav .links a:hover { border-color: var(--accent); color: var(--accent); }
  .nav .links a.active { color: var(--accent); background: var(--surface2); border-color: var(--accent); }

  /* ── Content ── */
  .container { max-width: 1200px; margin: 0 auto; padding: 24px 32px; }

  /* ── Metric Cards Row 1 ── */
  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
  .metric {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px 24px;
  }
  .metric .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .metric .value { font-size: 28px; font-weight: 700; margin-top: 4px; }
  .metric .sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .metric .value.green { color: var(--green); }
  .metric .value.orange { color: var(--orange); }
  .metric .value.accent { color: var(--accent); }
  .metric .value.red { color: var(--red); }

  /* ── Metric Cards Row 2 ── */
  .metrics2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 24px; }
  .metric2 {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px 24px; cursor: pointer; transition: border-color 0.12s;
  }
  .metric2:hover { border-color: var(--accent); }
  .metric2 .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .metric2 .value { font-size: 28px; font-weight: 700; margin-top: 4px; }
  .metric2 .sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .metric2 .value.green { color: var(--green); }
  .metric2 .value.orange { color: var(--orange); }
  .metric2 .value.accent { color: var(--accent); }
  .metric2 .value.red { color: var(--red); }

  /* ── Main Grid ── */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px 24px;
  }
  .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 16px; color: var(--text-dim); }
  .card .chart-wrap { position: relative; height: 200px; }
  .card.span-2 { grid-column: 1 / -1; }
  .card .chart-wrap.tall { height: 260px; }

  /* ── Type Classification ── */
  .type-row {
    display: flex; align-items: center; gap: 12px; padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .type-row:last-child { border-bottom: none; }
  .type-row .icon { width: 28px; text-align: center; }
  .type-row .name { width: 60px; font-size: 13px; }
  .type-row .bar-wrap { flex: 1; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  .type-row .bar { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
  .type-row .count { width: 28px; text-align: right; font-size: 14px; font-weight: 600; }

  /* ── Insights ── */
  .insight {
    display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border);
    align-items: flex-start;
  }
  .insight:last-child { border-bottom: none; }
  .insight .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
  .insight .text { font-size: 13px; line-height: 1.5; color: var(--text-dim); }
  .insight .text strong { color: var(--text); }

  /* ── Loading ── */
  .loading {
    display: flex; align-items: center; justify-content: center;
    height: 200px; color: var(--text-muted); font-size: 14px;
  }
  .loading::after {
    content: ''; width: 20px; height: 20px; margin-left: 10px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Modal ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 480px; max-height: 80vh; overflow-y: auto; }
  .modal h3 { font-size: 16px; margin-bottom: 16px; }
  .modal .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .modal .row:last-child { border-bottom: none; }
  .modal .row .k { color: var(--text-muted); }
  .modal .row .v { color: var(--text); font-weight: 500; }
  .modal .close { margin-top: 16px; padding: 8px 20px; border-radius: var(--radius); border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer; font-size: 13px; }
  .modal .close:hover { background: var(--hover); }

  /* ── Log ── */
  .log-card { margin-bottom: 24px; }
  .log-list { max-height: 300px; overflow-y: auto; }
  .log-list::-webkit-scrollbar { width: 4px; }
  .log-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .log-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 8px 0; border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .log-item:last-child { border-bottom: none; }
  .log-time { font-size: 11px; color: var(--text-muted); white-space: nowrap; width: 70px; flex-shrink: 0; }
  .log-type {
    font-size: 10px; padding: 1px 6px; border-radius: 4px;
    white-space: nowrap; flex-shrink: 0; width: 44px; text-align: center;
  }
  .log-type.pref { background: #8b5cf622; color: #a78bfa; }
  .log-type.fact { background: #22c55e22; color: #4ade80; }
  .log-type.act { background: #a78bfa22; color: #c4b5fd; }
  .log-type.goal { background: #06b6d422; color: #22d3ee; }
  .log-type.dec { background: #a855f722; color: #c084fc; }
  .log-type.obs { background: #f59e0b22; color: #fbbf24; }
  .log-text { color: var(--text-dim); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log-empty { padding: 30px 0; text-align: center; color: var(--text-muted); font-size: 13px; }

  @media (max-width: 768px) {
    .nav { padding: 12px 16px; flex-wrap: wrap; }
    .container { padding: 16px; }
    .metrics { grid-template-columns: repeat(2, 1fr); }
    .metrics2 { grid-template-columns: 1fr; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="nav">
  <h1>🧠 <span>仪表盘</span></h1>
  <select id="agent-select" onchange="loadDashboard()"></select>
  <div class="spacer"></div>
  <div class="links">
    <a href="/chat">💬 聊天</a>
    <a href="/graph">🔗 图谱</a>
    <a href="/dashboard" class="active">📊 仪表盘</a>
  </div>
</div>

<div class="container">
  <!-- Row 1: 4 metric cards -->
  <div class="metrics">
    <div class="metric">
      <div class="label">📦 总记忆</div>
      <div class="value accent" id="m-total">—</div>
      <div class="sub" id="m-total-sub"></div>
    </div>
    <div class="metric">
      <div class="label">🧩 抽象概念</div>
      <div class="value green" id="m-concepts">—</div>
      <div class="sub">核心信念·置信度≥0.9</div>
    </div>
    <div class="metric">
      <div class="label">🔐 知识库</div>
      <div class="value accent" id="m-creds">—</div>
      <div class="sub">安全存储的凭证</div>
    </div>
    <div class="metric">
      <div class="label">⚠️ 需关注</div>
      <div class="value orange" id="m-risk">—</div>
      <div class="sub">待解决的矛盾</div>
    </div>
  </div>

  <!-- Row 2: 4 metric cards (v0.13 新增 STM + 路由) -->
  <div class="metrics2">
    <div class="metric2" id="health-card" onclick="showHealthDetail()">
      <div class="label">💚 系统健康</div>
      <div class="value" id="m-health">—</div>
      <div class="sub" id="m-health-sub"></div>
    </div>
    <div class="metric2">
      <div class="label">🔧 MCP 工具</div>
      <div class="value accent" id="m-tools">—</div>
      <div class="sub">已注册的工具数量</div>
    </div>
    <div class="metric2">
      <div class="label">⚡ 短期缓存</div>
      <div class="value green" id="m-stm">—</div>
      <div class="sub">STM 缓冲区中的即时记忆</div>
    </div>
    <div class="metric2">
      <div class="label">🎯 智能路由</div>
      <div class="value accent" id="m-route-pct">—</div>
      <div class="sub" id="m-route-sub">精确查询占比</div>
    </div>
  </div>

  <!-- Charts -->
  <div class="grid">
    <div class="card">
      <h2>📂 记忆分布</h2>
      <div class="chart-wrap"><canvas id="type-chart"></canvas></div>
    </div>
    <div class="card">
      <h2>📈 增长趋势</h2>
      <div class="chart-wrap"><canvas id="growth-chart"></canvas></div>
    </div>
  </div>

  <!-- Bottom row -->
  <div class="grid">
    <div class="card">
      <h2>🔍 关键洞察</h2>
      <div id="insights"><div class="loading">分析中</div></div>
    </div>
    <div class="card">
      <h2>🏷️ 记忆分类</h2>
      <div id="type-classification"><div class="loading">加载中</div></div>
    </div>
  </div>

  <!-- Activity Log -->
  <div class="card log-card">
    <h2>📋 活动日志</h2>
    <div class="log-list" id="log-list"><div class="log-empty">加载中…</div></div>
  </div>

</div>

<!-- Health detail modal -->
<div id="health-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeHealthModal()">
  <div class="modal">
    <h3>💚 系统健康详情</h3>
    <div id="health-detail"></div>
    <button class="close" onclick="closeHealthModal()">关闭</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'memoryagent_v3';

function getAgents() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    const agents = [];
    const ags = data.agents;
    if (ags && typeof ags === 'object') {
      for (const id of Object.keys(ags)) {
        const a = ags[id];
        agents.push({ id, name: (a && a.name) || id });
      }
    }
    return agents.length > 0 ? agents : [{ id: 'default', name: 'default' }];
  } catch(e) { return [{ id: 'default', name: 'default' }]; }
}

function initAgentSelect() {
  const sel = document.getElementById('agent-select');
  const agents = getAgents();
  sel.innerHTML = agents.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
  const saved = localStorage.getItem('memoryagent_current_agent');
  if (saved && agents.some(a => a.id === saved)) sel.value = saved;
  if (agents.length <= 1 && agents[0]?.id === 'default') {
    fetch('/agents').then(r => r.json()).then(data => {
      if (data.agents && data.agents.length > 0) {
        sel.innerHTML = data.agents.map(a => `<option value="${a.id}">${a.id}</option>`).join('');
        loadDashboard();
      }
    }).catch(() => {});
  }
}

const TYPES = [
  { key: 'preference', icon: '⭐', label: '偏好', color: '#8b5cf6' },
  { key: 'fact', icon: '✅', label: '事实', color: '#22c55e' },
  { key: 'action', icon: '🛠️', label: '行为', color: '#a78bfa' },
  { key: 'goal', icon: '🎯', label: '目标', color: '#06b6d4' },
  { key: 'decision', icon: '📌', label: '决策', color: '#a855f7' },
  { key: 'observation', icon: '📝', label: '观察', color: '#f59e0b' },
];

let typeChart = null;
let growthChart = null;

function renderTypeChart(counts) {
  const canvas = document.getElementById('type-chart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (typeof Chart === 'undefined') {
    document.getElementById('type-chart').parentElement.innerHTML = '<div class="loading">📊 Chart.js 未加载</div>'; return;
  }
  if (typeChart) typeChart.destroy();
  const data = TYPES.map(t => ({ label: t.label, count: counts[t.key] || 0, color: t.color }));
  typeChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: data.map(d => d.label),
      datasets: [{ data: data.map(d => d.count), backgroundColor: data.map(d => d.color), borderWidth: 0 }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      cutout: '70%',
      plugins: {
        legend: { position: 'bottom', labels: { color: '#64748b', padding: 12, font: { size: 11 } } },
      },
    },
  });
}

function renderGrowthChart(memories) {
  const canvas = document.getElementById('growth-chart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (typeof Chart === 'undefined') {
    document.getElementById('growth-chart').parentElement.innerHTML = '<div class="loading">📊 Chart.js 未加载</div>'; return;
  }
  if (growthChart) growthChart.destroy();
  const sorted = [...memories].filter(m => m.created_at > 0).sort((a, b) => a.created_at - b.created_at);
  if (sorted.length === 0) {
    document.getElementById('growth-chart').parentElement.innerHTML = '<div class="loading">暂无时间数据</div>'; return;
  }
  const dateCounts = {};
  sorted.forEach(m => {
    const d = new Date(m.created_at * 1000).toISOString().slice(0, 10);
    dateCounts[d] = (dateCounts[d] || 0) + 1;
  });
  const dates = Object.keys(dateCounts).sort();
  let cum = 0;
  const values = dates.map(d => { cum += dateCounts[d]; return cum; });
  growthChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: dates.map(d => d.slice(5)),
      datasets: [{
        label: '累积记忆', data: values,
        borderColor: '#8b5cf6', backgroundColor: '#8b5cf622',
        fill: true, tension: 0.3, pointRadius: 2,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { color: '#e2e8f0' } },
        y: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { color: '#e2e8f0' }, beginAtZero: true },
      },
    },
  });
}

function renderTypeClassification(counts, total) {
  const el = document.getElementById('type-classification');
  const maxCount = Math.max(1, ...Object.values(counts));
  el.innerHTML = TYPES.map(t => {
    const c = counts[t.key] || 0;
    const pct = total > 0 ? (c / total * 100).toFixed(0) : 0;
    return `<div class="type-row">
      <span class="icon">${t.icon}</span>
      <span class="name">${t.label}</span>
      <div class="bar-wrap"><div class="bar" style="width:${c / maxCount * 100}%;background:${t.color}"></div></div>
      <span class="count">${c}</span>
      <span style="font-size:11px;color:var(--text-muted);width:32px;text-align:right">${pct}%</span>
    </div>`;
  }).join('');
  if (Object.keys(counts).length === 0) {
    el.innerHTML = '<div style="padding:20px 0;color:var(--text-muted);font-size:13px;text-align:center">暂无记忆</div>';
  }
}

function renderInsights(memories, counts) {
  const el = document.getElementById('insights');
  const total = memories.length;
  const insights = [];
  if (total === 0) {
    el.innerHTML = '<div style="padding:20px 0;color:var(--text-muted);font-size:13px;text-align:center">暂无记忆数据，去聊天页面发消息吧</div>'; return;
  }
  const maxType = TYPES.reduce((a, b) => (counts[a.key] || 0) > (counts[b.key] || 0) ? a : b);
  insights.push({ color: maxType.color, text: `<strong>${maxType.label}</strong> 是最多的记忆类型，占 ${total > 0 ? (counts[maxType.key]/total*100).toFixed(0) : 0}%` });
  const sorted = [...memories].filter(m => m.created_at > 0).sort((a, b) => b.created_at - a.created_at);
  const recent = sorted[0];
  if (recent) {
    const days = Math.floor((Date.now()/1000 - recent.created_at) / 86400);
    insights.push({ color: '#8b5cf6', text: `最新的记忆是 <strong>${days === 0 ? '今天' : days + '天前'}</strong>：${recent.content.slice(0, 50)}${recent.content.length > 50 ? '…' : ''}` });
  }
  const riskCount = memories.filter(m => (m.confidence || 0) < 0.3).length;
  if (riskCount > 0) {
    insights.push({ color: '#f59e0b', text: `<strong>${riskCount} 条</strong>记忆置信度偏低，建议运行归纳整理` });
  } else if (total > 0) {
    insights.push({ color: '#22c55e', text: `<strong>所有记忆状态良好</strong>，无需维护` });
  }
  el.innerHTML = insights.map(i =>
    `<div class="insight"><span class="dot" style="background:${i.color}"></span><div class="text">${i.text}</div></div>`
  ).join('');
}


function renderLog(memories) {
  const el = document.getElementById('log-list');
  if (!memories || memories.length === 0) {
    el.innerHTML = '<div class="log-empty">暂无活动记录</div>'; return;
  }
  const sorted = [...memories].filter(m => m.created_at > 0).sort((a, b) => b.created_at - a.created_at).slice(0, 50);
  el.innerHTML = sorted.map(m => {
    const t = m.memory_type || 'observation';
    const typeMap = { preference: ['⭐', 'pref'], fact: ['✅', 'fact'], action: ['🛠️', 'act'],
                      goal: ['🎯', 'goal'], decision: ['📌', 'dec'], observation: ['📝', 'obs'] };
    const [icon, cls] = typeMap[t] || ['📝', 'obs'];
    const time = new Date(m.created_at * 1000);
    const timeStr = time.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    return `<div class="log-item">
      <span class="log-time">${timeStr}</span>
      <span class="log-type ${cls}">${icon}</span>
      <span class="log-text">${esc(m.content || '')}</span>
    </div>`;
  }).join('');
}

// ── Health Detail ──
let _healthData = null;

function showHealthDetail() {
  const modal = document.getElementById('health-modal');
  const detail = document.getElementById('health-detail');
  if (!_healthData) { detail.innerHTML = '<div class="loading" style="height:100px">加载中</div>'; modal.style.display = 'flex'; return; }

  const checks = _healthData.checks || {};
  const router = checks.router || {};
  const totalQ = router.total_queries || 0;
  const factualPct = router.intent_factual_pct || '0%';
  const rows = [
    { k: '运行时间', v: checks.uptime || '-' },
    { k: '配置文件', v: checks.config || '-' },
    { k: '总记忆', v: (checks.memory?.total ?? '-') + '' },
    { k: '核心信念', v: (checks.memory?.core_beliefs ?? '-') + '' },
    { k: '矛盾数', v: (checks.memory?.contradictions ?? '-') + '' },
    { k: '不可靠记忆', v: (checks.memory?.unreliable ?? '-') + '' },
    // v0.13 新指标
    { k: 'STM缓冲区', v: (checks.memory?.stm_buffer ?? '-') + ' 条' },
    { k: '精确查询(Factual)', v: factualPct + ' (' + (router.intent_factual || 0) + ')' },
    { k: '主动检索命中', v: (router.active_retrieval_hits || 0) + '' },
    { k: '查询总数', v: totalQ + '' },
    { k: 'API 调用', v: (checks.api?.total_calls ?? '-') + '' },
    { k: 'API 错误率', v: checks.api?.windowed_error_rate || '-' },
    { k: 'MCP 工具', v: (checks.tools ?? '-') + '' },
    { k: '健康分', v: (_healthData.score ?? '-') + '/100' },
  ];
  // 偏好单独显示
  if (checks.memory?.by_type?.preference !== undefined) {
    rows.push({ k: '偏好数', v: checks.memory.by_type.preference + '' });
  }
  detail.innerHTML = rows.map(r =>
    `<div class="row"><span class="k">${r.k}</span><span class="v">${r.v}</span></div>`
  ).join('');
  modal.style.display = 'flex';
}

function closeHealthModal() {
  document.getElementById('health-modal').style.display = 'none';
}

async function loadDashboard() {
  const agentId = document.getElementById('agent-select').value;
  if (!agentId) return;
  localStorage.setItem('memoryagent_current_agent', agentId);

  const isFirstLoad = !window._dashboardLoaded;
  if (isFirstLoad) {
    document.querySelectorAll('.loading').forEach(el => { if (el) el.style.display = 'flex'; });
  }

  try {
    // Fetch health (has all metrics we need) + decay-analysis + stats(credentials)
    const [healthResp, decayResp, statsResp] = await Promise.all([
      fetch('/health'),
      fetch('/decay-analysis?agent_id=' + encodeURIComponent(agentId) + '&min_confidence=0'),
      fetch('/stats?agent_id=' + encodeURIComponent(agentId)),
    ]);
    const health = await healthResp.json();
    _healthData = health;
    const statsData = await statsResp.json();
    const decay = await decayResp.json();
    const memories = decay.memories || [];

    // Row 1 metrics
    const total = health.checks?.memory?.total || memories.length || 0;
    const concepts = health.checks?.memory?.core_beliefs || 0;
    const contradictions = health.checks?.memory?.contradictions || 0;
    const credentialCount = statsData.credential_count || 0;

    // Row 2 metrics
    const healthScore = health.score || 0;
    const healthLabel = health.label || '—';
    const tools = health.checks?.tools || 0;

    document.getElementById('m-total').textContent = total;
    document.getElementById('m-total-sub').textContent = `共 ${Object.keys(health.checks?.memory?.by_type || {}).length} 种类型`;
    document.getElementById('m-concepts').textContent = concepts;
    document.getElementById('m-creds').textContent = credentialCount;
    document.getElementById('m-risk').textContent = contradictions;

    const healthEl = document.getElementById('m-health');
    healthEl.textContent = healthScore >= 80 ? '✅ 健康' : healthScore >= 50 ? '⚠️ 一般' : '🔴 异常';
    healthEl.className = 'value ' + (healthScore >= 80 ? 'green' : healthScore >= 50 ? 'orange' : 'red');
    document.getElementById('m-health-sub').textContent = healthLabel.replace('✅ ','').replace('⚠️ ','').replace('🔴 ','');

    document.getElementById('m-tools').textContent = tools;

    // ★ v0.13: STM 缓冲区 + 路由统计
    const stmCount = health.checks?.memory?.stm_buffer || 0;
    document.getElementById('m-stm').textContent = stmCount;
    document.getElementById('m-stm').className = 'value ' + (stmCount > 0 ? 'green' : '');
    const route = health.checks?.router || {};
    const factualPct = route.intent_factual_pct || '0%';
    const activeHits = route.active_retrieval_hits || 0;
    document.getElementById('m-route-pct').textContent = factualPct;
    document.getElementById('m-route-sub').textContent =
      `主动检索命中 ${activeHits} 次 · 共 ${route.total_queries || 0} 次查询`;

    // Count by type from memories
    const counts = {};
    TYPES.forEach(t => counts[t.key] = 0);
    memories.forEach(m => { if (m.memory_type) counts[m.memory_type] = (counts[m.memory_type] || 0) + 1; });

    renderTypeChart(counts);
    renderGrowthChart(memories);
    renderTypeClassification(counts, total);
    renderInsights(memories, counts);
    renderLog(memories);
    window._dashboardLoaded = true;

  } catch(e) {
    document.getElementById('insights').innerHTML = '<div style="color:var(--red);font-size:13px">❌ ' + e.message + '</div>';
    document.querySelectorAll('#type-chart, #growth-chart').forEach(el => {
      const p = el.parentElement;
      if (p && p.querySelector('.loading')) p.innerHTML = '<div class="loading">❌ 加载失败</div>';
    });
  }
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

initAgentSelect();
loadDashboard();
// 每 30 秒自动刷新
setInterval(loadDashboard, 30000);
</script>
</body>
</html>
