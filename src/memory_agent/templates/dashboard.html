<!DOCTYPE html>
<html lang="zh-CN" class="notranslate" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仪表盘 · MemoryAgent</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --bg: #0b1120;
    --surface: #131c31;
    --surface2: #182340;
    --border: #1e2d4a;
    --text: #e8edf5;
    --text-dim: #8899b4;
    --text-muted: #5a6d85;
    --accent: #3b82f6;
    --green: #22c55e;
    --orange: #f59e0b;
    --red: #ef4444;
    --pref: #3b82f6; --fact: #22c55e; --goal: #06b6d4;
    --decision: #a855f7; --obs: #f59e0b; --action: #a78bfa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, 'Inter', 'Segoe UI', sans-serif;
    min-height: 100vh;
  }

  /* ── Navigation ── */
  .nav {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 32px; background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .nav h1 { font-size: 18px; font-weight: 600; }
  .nav h1 span { color: var(--accent); }
  .nav .spacer { flex: 1; }
  .nav select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; font-size: 13px;
    outline: none; cursor: pointer;
  }
  .nav .links { display: flex; gap: 8px; }
  .nav .links a {
    color: var(--text-dim); text-decoration: none; font-size: 13px;
    padding: 4px 10px; border-radius: 6px; transition: 0.2s;
  }
  .nav .links a:hover { color: var(--text); background: var(--surface2); }
  .nav .links a.active { color: var(--accent); background: var(--surface2); }

  /* ── Content ── */
  .container { max-width: 1200px; margin: 0 auto; padding: 24px 32px; }

  /* ── Metric Cards ── */
  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  .metric {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px 24px;
  }
  .metric .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .metric .value { font-size: 28px; font-weight: 700; margin-top: 4px; }
  .metric .sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .metric .value.green { color: var(--green); }
  .metric .value.orange { color: var(--orange); }
  .metric .value.accent { color: var(--accent); }
  .metric .value.red { color: var(--red); }

  /* ── Main Grid ── */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px 24px;
  }
  .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 16px; color: var(--text-dim); }
  .card .chart-wrap { position: relative; height: 200px; }
  .card.span-2 { grid-column: 1 / -1; }
  .card .chart-wrap.tall { height: 260px; }

  /* ── Type Classification ── */
  .type-row {
    display: flex; align-items: center; gap: 12px; padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .type-row:last-child { border-bottom: none; }
  .type-row .icon { width: 28px; text-align: center; }
  .type-row .name { width: 60px; font-size: 13px; }
  .type-row .bar-wrap { flex: 1; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  .type-row .bar { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
  .type-row .count { width: 28px; text-align: right; font-size: 14px; font-weight: 600; }

  /* ── Insights ── */
  .insight {
    display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border);
    align-items: flex-start;
  }
  .insight:last-child { border-bottom: none; }
  .insight .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
  .insight .text { font-size: 13px; line-height: 1.5; color: var(--text-dim); }
  .insight .text strong { color: var(--text); }

  /* ── Loading ── */
  .loading {
    display: flex; align-items: center; justify-content: center;
    height: 200px; color: var(--text-muted); font-size: 14px;
  }
  .loading::after {
    content: ''; width: 20px; height: 20px; margin-left: 10px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Network Viz (compact) ── */
  #network-canvas { width: 100%; height: 240px; border-radius: 8px; cursor: grab; }
  #network-canvas:active { cursor: grabbing; }
  .net-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; font-size: 11px; color: var(--text-muted); }
  .net-legend .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  @media (max-width: 768px) {
    .nav { padding: 12px 16px; flex-wrap: wrap; }
    .container { padding: 16px; }
    .metrics { grid-template-columns: repeat(2, 1fr); }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="nav">
  <h1>🧠 <span>仪表盘</span></h1>
  <select id="agent-select" onchange="loadData()"></select>
  <div class="spacer"></div>
  <div class="links">
    <a href="/chat">💬 聊天</a>
    <a href="/graph">🔗 图谱</a>
    <a href="/dashboard" class="active">📊 仪表盘</a>
  </div>
</div>

<div class="container">
  <!-- Metrics -->
  <div class="metrics" id="metrics">
    <div class="metric"><div class="label">总记忆</div><div class="value accent" id="m-total">—</div><div class="sub" id="m-total-sub"></div></div>
    <div class="metric"><div class="label">信念</div><div class="value green" id="m-prefs">—</div><div class="sub">置信度≥0.9</div></div>
    <div class="metric"><div class="label">矛盾</div><div class="value orange" id="m-risk">—</div><div class="sub">待解决</div></div>
    <div class="metric"><div class="label">系统健康</div><div class="value" id="m-health">—</div><div class="sub" id="m-health-sub"></div></div>
  </div>

  <!-- Charts -->
  <div class="grid">
    <div class="card">
      <h2>📂 记忆分布</h2>
      <div class="chart-wrap"><canvas id="type-chart"></canvas></div>
    </div>
    <div class="card">
      <h2>📈 增长趋势</h2>
      <div class="chart-wrap"><canvas id="growth-chart"></canvas></div>
    </div>
  </div>

  <!-- Bottom row -->
  <div class="grid">
    <div class="card">
      <h2>🔍 关键洞察</h2>
      <div id="insights"><div class="loading">分析中</div></div>
    </div>
    <div class="card">
      <h2>🏷️ 记忆分类</h2>
      <div id="type-classification"><div class="loading">加载中</div></div>
    </div>
  </div>

  <!-- Network graph (compact) -->
  <div class="grid">
    <div class="card span-2">
      <h2>🔗 记忆网络</h2>
      <canvas id="network-canvas"></canvas>
      <div class="net-legend" id="net-legend"></div>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'memoryagent_v3';

// ── Agent Select ──
function getAgents() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    const agents = [];
    const ags = data.agents;
    if (ags && typeof ags === 'object') {
      for (const id of Object.keys(ags)) {
        const a = ags[id];
        agents.push({ id, name: (a && a.name) || id });
      }
    }
    return agents.length > 0 ? agents : [{ id: 'default', name: 'default' }];
  } catch(e) { return [{ id: 'default', name: 'default' }]; }
}

function initAgentSelect() {
  const sel = document.getElementById('agent-select');
  const agents = getAgents();
  sel.innerHTML = agents.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
  const saved = localStorage.getItem('memoryagent_current_agent');
  if (saved && agents.some(a => a.id === saved)) sel.value = saved;

  // Fallback: load from API if localStorage empty
  if (agents.length <= 1 && agents[0]?.id === 'default') {
    fetch('/agents').then(r => r.json()).then(data => {
      if (data.agents && data.agents.length > 0) {
        sel.innerHTML = data.agents.map(a =>
          `<option value="${a.id}">${a.id}</option>`
        ).join('');
        loadData();
      }
    }).catch(() => {});
  }
}

// ── Type config ──
const TYPES = [
  { key: 'preference', icon: '⭐', label: '偏好', color: '#3b82f6' },
  { key: 'fact', icon: '✅', label: '事实', color: '#22c55e' },
  { key: 'action', icon: '🛠️', label: '行为', color: '#a78bfa' },
  { key: 'goal', icon: '🎯', label: '目标', color: '#06b6d4' },
  { key: 'decision', icon: '📌', label: '决策', color: '#a855f7' },
  { key: 'observation', icon: '📝', label: '观察', color: '#f59e0b' },
];

// ── Charts ──
let typeChart = null;
let growthChart = null;
let networkAnim = null;

function renderTypeChart(counts) {
  const ctx = document.getElementById('type-chart').getContext('2d');
  if (typeChart) typeChart.destroy();
  const data = TYPES.map(t => ({ label: t.label, count: counts[t.key] || 0, color: t.color }));
  typeChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: data.map(d => d.label),
      datasets: [{ data: data.map(d => d.count), backgroundColor: data.map(d => d.color), borderWidth: 0 }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      cutout: '70%',
      plugins: {
        legend: {
          position: 'bottom', labels: { color: '#94a3b8', padding: 12, font: { size: 11 } },
        },
      },
    },
  });
}

function renderGrowthChart(memories) {
  const ctx = document.getElementById('growth-chart').getContext('2d');
  if (growthChart) growthChart.destroy();

  // Sort by created_at, build cumulative
  const sorted = [...memories].filter(m => m.created_at > 0).sort((a, b) => a.created_at - b.created_at);
  if (sorted.length === 0) {
    document.getElementById('growth-chart').parentElement.innerHTML = '<div class="loading">暂无时间数据</div>';
    return;
  }
  const dateCounts = {};
  sorted.forEach(m => {
    const d = new Date(m.created_at * 1000).toISOString().slice(0, 10);
    dateCounts[d] = (dateCounts[d] || 0) + 1;
  });
  const dates = Object.keys(dateCounts).sort();
  let cum = 0;
  const values = dates.map(d => { cum += dateCounts[d]; return cum; });

  growthChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: dates.map(d => d.slice(5)),
      datasets: [{
        label: '累积记忆', data: values,
        borderColor: '#3b82f6', backgroundColor: '#3b82f633',
        fill: true, tension: 0.3, pointRadius: 2,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { color: '#1e2d4a' } },
        y: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { color: '#1e2d4a' }, beginAtZero: true },
      },
    },
  });
}

// ── Type Classification ──
function renderTypeClassification(counts, total) {
  const el = document.getElementById('type-classification');
  const maxCount = Math.max(1, ...Object.values(counts));
  el.innerHTML = TYPES.map(t => {
    const c = counts[t.key] || 0;
    const pct = total > 0 ? (c / total * 100).toFixed(0) : 0;
    return `<div class="type-row">
      <span class="icon">${t.icon}</span>
      <span class="name">${t.label}</span>
      <div class="bar-wrap"><div class="bar" style="width:${c / maxCount * 100}%;background:${t.color}"></div></div>
      <span class="count">${c}</span>
      <span style="font-size:11px;color:var(--text-muted);width:32px;text-align:right">${pct}%</span>
    </div>`;
  }).join('');
  if (Object.keys(counts).length === 0) {
    el.innerHTML = '<div style="padding:20px 0;color:var(--text-muted);font-size:13px;text-align:center">暂无记忆</div>';
  }
}

// ── Insights ──
function renderInsights(memories, counts) {
  const el = document.getElementById('insights');
  const total = memories.length;
  const insights = [];

  if (total === 0) {
    el.innerHTML = '<div style="padding:20px 0;color:var(--text-muted);font-size:13px;text-align:center">暂无记忆数据，去聊天页面发消息吧</div>';
    return;
  }

  // Most common type
  const maxType = TYPES.reduce((a, b) => (counts[a.key] || 0) > (counts[b.key] || 0) ? a : b);
  insights.push({ color: maxType.color, text: `<strong>${maxType.label}</strong> 是最多的记忆类型，占 ${total > 0 ? (counts[maxType.key]/total*100).toFixed(0) : 0}%` });

  // Recent memory
  const sorted = [...memories].filter(m => m.created_at > 0).sort((a, b) => b.created_at - a.created_at);
  const recent = sorted[0];
  if (recent) {
    const days = Math.floor((Date.now()/1000 - recent.created_at) / 86400);
    insights.push({ color: '#3b82f6', text: `最新的记忆是 <strong>${days === 0 ? '今天' : days + '天前'}</strong>：${recent.content.slice(0, 50)}${recent.content.length > 50 ? '…' : ''}` });
  }

  // Risk count
  const riskCount = memories.filter(m => (m.confidence || 0) < 0.3).length;
  if (riskCount > 0) {
    insights.push({ color: '#f59e0b', text: `<strong>${riskCount} 条</strong>记忆置信度偏低，建议运行归纳整理` });
  } else if (total > 0) {
    insights.push({ color: '#22c55e', text: `<strong>所有记忆状态良好</strong>，无需维护` });
  }

  el.innerHTML = insights.map(i =>
    `<div class="insight"><span class="dot" style="background:${i.color}"></span><div class="text">${i.text}</div></div>`
  ).join('');
}

// ── Network Graph (compact) ──
function drawNetwork(memories) {
  const canvas = document.getElementById('network-canvas');
  const ctx = canvas.getContext('2d');
  const parent = canvas.parentElement;
  canvas.width = parent.clientWidth - 48;
  canvas.height = 240;
  const W = canvas.width, H = canvas.height;

  if (networkAnim) cancelAnimationFrame(networkAnim);

  if (memories.length < 2) {
    ctx.fillStyle = '#64748b'; ctx.font = '14px sans-serif';
    ctx.textAlign = 'center'; ctx.fillText('需要至少2条记忆', W/2, H/2);
    document.getElementById('net-legend').innerHTML = '';
    return;
  }

  const nodes = memories.slice(0, 25).map((m, i) => ({
    id: m.id, content: m.content, type: m.memory_type || 'observation',
    conf: m.confidence || 0.5,
    x: Math.random() * W, y: Math.random() * H, vx: 0, vy: 0
  }));

  const edges = [];
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      let sim = nodes[i].type === nodes[j].type ? 0.3 : 0;
      const w1 = new Set(nodes[i].content.toLowerCase().split(/\s+/));
      const w2 = new Set(nodes[j].content.toLowerCase().split(/\s+/));
      const inter = [...w1].filter(w => w2.has(w) && w.length > 1);
      if (w1.size + w2.size > 0) sim += (inter.length * 2) / (w1.size + w2.size) * 0.7;
      if (sim > 0.3) edges.push({ from: i, to: j, strength: sim });
    }
  }

  if (edges.length === 0) {
    ctx.fillStyle = '#64748b'; ctx.font = '14px sans-serif';
    ctx.textAlign = 'center'; ctx.fillText('记忆间暂无明显关联', W/2, H/2);
    document.getElementById('net-legend').innerHTML = '<span>记忆间暂无明显关联</span>';
    return;
  }

  const typeColors = { preference:'#3b82f6', action:'#a78bfa', fact:'#22c55e', goal:'#06b6d4', decision:'#a855f7', observation:'#f59e0b' };
  const typeNames = { preference:'偏好', action:'行为', fact:'事实', goal:'目标', decision:'决策', observation:'观察' };
  const types = [...new Set(nodes.map(n => n.type))];
  document.getElementById('net-legend').innerHTML = types.map(t =>
    `<span><span class="dot" style="background:${typeColors[t]||'#94a3b8'}"></span> ${typeNames[t]||t}</span>`
  ).join('') + `<span style="margin-left:auto;font-size:10px">${nodes.length}节点 · ${edges.length}连线</span>`;

  function simulate() {
    for (const n of nodes) { n.fx = 0; n.fy = 0; }
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const dx = nodes[j].x - nodes[i].x, dy = nodes[j].y - nodes[i].y;
        const dist = Math.max(1, Math.sqrt(dx*dx + dy*dy));
        const force = 600 / (dist * dist + 1);
        nodes[i].fx -= force * dx / dist; nodes[i].fy -= force * dy / dist;
        nodes[j].fx += force * dx / dist; nodes[j].fy += force * dy / dist;
      }
    }
    for (const e of edges) {
      const a = nodes[e.from], b = nodes[e.to];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.max(1, Math.sqrt(dx*dx + dy*dy));
      const force = dist * e.strength * 0.008;
      a.fx += force * dx / dist; a.fy += force * dy / dist;
      b.fx -= force * dx / dist; b.fy -= force * dy / dist;
    }
    for (const n of nodes) { n.fx += (W/2 - n.x) * 0.002; n.fy += (H/2 - n.y) * 0.002; }
    for (const n of nodes) {
      n.vx = (n.vx + n.fx) * 0.85; n.vy = (n.vy + n.fy) * 0.85;
      n.x += n.vx; n.y += n.vy;
      n.x = Math.max(5, Math.min(W-5, n.x)); n.y = Math.max(5, Math.min(H-5, n.y));
    }

    ctx.clearRect(0, 0, W, H);
    for (const e of edges) {
      ctx.beginPath(); ctx.moveTo(nodes[e.from].x, nodes[e.from].y);
      ctx.lineTo(nodes[e.to].x, nodes[e.to].y);
      ctx.strokeStyle = `rgba(148,163,184,${e.strength*0.35})`; ctx.lineWidth = e.strength*2; ctx.stroke();
    }
    for (const n of nodes) {
      ctx.beginPath(); ctx.arc(n.x, n.y, 3 + n.conf*4, 0, Math.PI*2);
      ctx.fillStyle = typeColors[n.type] || '#94a3b8'; ctx.fill();
    }
    networkAnim = requestAnimationFrame(simulate);
  }
  simulate();
}

// ── Main Load ──
async function loadData() {
  const agentId = document.getElementById('agent-select').value;
  if (!agentId) return;
  localStorage.setItem('memoryagent_current_agent', agentId);

  document.querySelectorAll('.loading').forEach(el => { if (el) el.style.display = 'flex'; });

  try {
    // Fetch stats + decay-analysis in parallel
    const [statsResp, decayResp] = await Promise.all([
      fetch('/stats?agent_id=' + encodeURIComponent(agentId)),
      fetch('/decay-analysis?agent_id=' + encodeURIComponent(agentId) + '&min_confidence=0'),
    ]);
    const stats = await statsResp.json();
    const decay = await decayResp.json();
    const memories = decay.memories || [];

    // Count by type
    const counts = {};
    TYPES.forEach(t => counts[t.key] = 0);
    memories.forEach(m => { if (m.memory_type) counts[m.memory_type] = (counts[m.memory_type] || 0) + 1; });

    const total = stats.total_facts || memories.length || 0;
    const core = stats.core_beliefs || 0;
    const ct = stats.contradictions || 0;
    const health = stats.label || '—';
    const healthScore = stats.score || 0;

    // Metrics
    document.getElementById('m-total').textContent = total;
    document.getElementById('m-total-sub').textContent = `共 ${TYPES.filter(t => counts[t.key] > 0).length} 种类型` || '';
    document.getElementById('m-prefs').textContent = core;
    document.getElementById('m-risk').textContent = ct;
    const healthEl = document.getElementById('m-health');
    healthEl.textContent = typeof health === 'number' ? health : (healthScore || '—');
    healthEl.className = 'value ' + (healthScore >= 80 ? 'green' : healthScore >= 50 ? 'orange' : 'red');
    document.getElementById('m-health-sub').textContent = stats.level === 'healthy' ? '✅ 系统健康' : (stats.level === 'warning' ? '⚠️ 需关注' : '🔴 建议维护');

    // Charts
    renderTypeChart(counts);
    renderGrowthChart(memories);

    // Classification + Insights
    renderTypeClassification(counts, total);
    renderInsights(memories, counts);

    // Network
    drawNetwork(memories);

  } catch(e) {
    document.getElementById('insights').innerHTML = '<div style="color:var(--red);font-size:13px">❌ 加载失败: ' + e.message + '</div>';
  }
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ── Init ──
initAgentSelect();
loadData();
</script>
</body>
</html>
