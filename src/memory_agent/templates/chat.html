<!DOCTYPE html>
<html lang="zh-CN" class="notranslate" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="google" content="notranslate">
<meta name="color-scheme" content="light dark">
<title>MemoryAgent</title>
<style>
  :root {
    --bg: #eff1f3;
    --surface: #ffffff;
    --surface2: #f7f8fa;
    --border: #dde0e4;
    --border-light: #e8eaed;
    --text: #1a1a2e;
    --text-dim: #555570;
    --text-muted: #8a8a9a;
    --accent: #8b5cf6;
    --accent-hover: #7c3aed;
    --accent-soft: #8b5cf612;
    --user-msg: #ffffff;
    --agent-msg: #f0f1f4;
    --green: #10b981;
    --amber: #f59e0b;
    --red: #ef4444;
    --hover: rgba(0,0,0,0.04);
    --sidebar-width: 290px;
    --radius: 8px;
    --radius-lg: 12px;
    --shadow: 0 1px 2px rgba(0,0,0,0.04);
    --msg-shadow: 0 1px 4px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --msg-agent-bg: #f8f7ff;
    --msg-agent-border: #e8e5ff;
    --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
    --code-bg: #1a1a2e;
    --code-text: #e4e4e7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1b26;
      --surface: #24253a;
      --surface2: #2a2b40;
      --border: #333458;
      --border-light: #2e2f48;
      --text: #e2e2ea;
      --text-dim: #9d9db5;
      --text-muted: #6b6b83;
      --accent: #a78bfa;
      --accent-hover: #8b5cf6;
      --accent-soft: #a78bfa18;
      --user-msg: #2e2f48;
      --agent-msg: #1e1b2e;
      --hover: rgba(255,255,255,0.06);
      --msg-shadow: 0 1px 4px rgba(0,0,0,0.25), 0 1px 2px rgba(0,0,0,0.15);
      --msg-agent-bg: #1e1b2e;
      --msg-agent-border: #3d2a6e;
      --code-bg: #0d0d1a;
      --code-text: #c4c4c7;
      --accent-gradient: linear-gradient(135deg, #a78bfa 0%, #8b5cf6 100%);
    }
    .msg.agent, .msg.agent .sender, .msg.agent .time,
    .msg.user, .msg.user .sender, .msg.user .time,
    .sidebar-wrap, .sidebar-overlay { color: var(--text); }
    .sidebar-wrap { background: rgba(30,27,46,0.96); }
    .sidebar-overlay { background: rgba(0,0,0,0.5); }
    .msg.agent code:not(pre code) {
      background: rgba(167,139,250,0.15);
      color: #c4b5fd;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
    font-size: 14px;
  }

  .sidebar-wrap {
    width: var(--sidebar-width);
    min-width: var(--sidebar-width);
    display: flex;
    flex-direction: column;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-right: 1px solid var(--border);
  }
  .sidebar {
    flex: 1;
    background: transparent;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .sidebar-top {
    flex-shrink: 0;
  }
  .sidebar-scroll {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
  }
  .sidebar-scroll::-webkit-scrollbar { width: 3px; }
  .sidebar-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .triple-wrap {
    flex-shrink: 0;
    border-bottom: 1px solid var(--border-light);
  }
  .triple-wrap .activity-hd {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface);
  }
  .triple-scroll {
    max-height: 120px;  /* ⭐ 缩小，给对话列表腾空间 */
    overflow-y: auto;
  }
  .triple-scroll::-webkit-scrollbar { width: 3px; }
  .triple-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .agent-section {
    flex-shrink: 0;
    border-top: 1px solid var(--border-light);
  }
  .agent-section .agent-hd-label {
    padding: 5px 12px;
    font-size: 10px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .agent-section .agent-add {
    padding: 8px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--text-dim); transition: all 0.12s;
    border-top: 1px solid var(--border-light); font-weight: 500;
  }
  .agent-section .agent-add:hover { color: var(--accent); background: var(--accent-soft); }
  .agent-section .agent-add .add-icon {
    width: 20px; height: 20px; border-radius: 6px;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; flex-shrink: 0;
    transition: all 0.12s;
  }
  .agent-section .agent-add:hover .add-icon { background: var(--accent); color: #fff; }
  .sidebar-gap {
    flex-shrink: 0;
    height: 18px;
    background: var(--bg);
  }

  /* ── Agent Header ── */
  .agent-hd {
    padding: 12px;
    border-bottom: 1px solid var(--border-light);
    cursor: pointer;
    transition: background 0.12s;
  }
  .agent-hd:hover { background: var(--hover); }
  .agent-hd-top {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .agent-av {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: var(--accent-gradient);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(139,92,246,0.2);
  }
  .agent-hd-info { flex: 1; min-width: 0; }
  .agent-hd-name {
    font-size: 14px; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  .agent-hd-name .toggle { font-size: 10px; color: var(--text-muted); }
  .agent-hd-status { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .agent-hd-stats {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .agent-hd-stats .s {
    flex: 1; text-align: center; padding: 6px 2px;
    border-radius: 6px; background: var(--bg);
    transition: background 0.12s;
  }
  .agent-hd-stats .s:hover { background: var(--accent-soft); }
  .agent-hd-stats .s .n { font-size: 15px; font-weight: 700; line-height: 1.2; }
  .agent-hd-stats .s .l { font-size: 9px; color: var(--text-muted); text-transform: uppercase; }
  .n-blue { color: var(--accent); }
  .n-green { color: var(--green); }
  .n-amber { color: var(--amber); }

  /* ── Knowledge Clusters ── */
  .cluster-section {
    padding: 6px 0;
    border-bottom: 1px solid var(--border-light);
  }
  .cluster-hd {
    padding: 4px 12px;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cluster-item {
    padding: 5px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    border-radius: 4px;
    margin: 0 4px;
    transition: background 0.1s;
  }
  .cluster-item:hover { background: var(--hover); }
  .cluster-icon { font-size: 14px; width: 20px; text-align: center; flex-shrink: 0; }
  .cluster-name { flex: 1; font-size: 13px; }
  .cluster-count {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--bg);
    padding: 1px 7px;
    border-radius: 8px;
  }
  .cluster-bar {
    width: 60px; height: 4px;
    border-radius: 2px;
    background: var(--border);
    overflow: hidden;
  }
  .cluster-bar .fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s;
  }

  /* ── Memory Activity Stream ── */
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .spin { animation: spin 0.5s ease-out; }

  .activity-hd {
    padding: 6px 12px;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--surface);
  }
  .activity-hd button {
    width: 20px; height: 20px; border-radius: 4px; border: none;
    background: transparent; color: var(--text-muted); font-size: 14px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .activity-hd button:hover { background: var(--hover); color: var(--text); }

  .activity-item {
    padding: 6px 12px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    cursor: pointer;
    border-radius: 4px;
    margin: 0 4px 1px;
    transition: background 0.1s;
  }
  .activity-item:hover { background: var(--hover); }
  .activity-item.active { background: var(--accent-soft); }
  .activity-emoji { font-size: 13px; width: 18px; text-align: center; flex-shrink: 0; margin-top: 1px; }
  .activity-body { flex: 1; min-width: 0; }
  .triple-item {
    padding: 4px 12px; border-bottom: 1px solid var(--border-light); cursor: default;
    font-size: 13px; transition: background 0.12s;
  }
  .triple-item:hover { background: var(--hover); }
  .triple-item .triple-subj { font-weight: 600; color: var(--accent); }
  .triple-item .triple-pred { color: var(--text-dim); margin: 0 2px; }
  .triple-item .triple-obj { font-weight: 500; }
  .triple-item .triple-meta {
    display: flex; gap: 8px; align-items: center; margin-top: 2px; font-size: 11px;
  }
  .triple-item .conf-bar {
    height: 4px; border-radius: 2px; background: var(--border);
    flex: 1; max-width: 60px; overflow: hidden;
  }
  .triple-item .conf-bar .fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
  .triple-item .conf-text { color: var(--text-muted); }
  .triple-item .type-badge {
    font-size: 10px; padding: 1px 5px; border-radius: 4px; background: var(--accent-soft); color: var(--accent);
  }
  .activity-text {
    font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .activity-meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
    display: flex;
    gap: 6px;
  }
  .activity-tag {
    font-size: 9px; padding: 0 5px; border-radius: 3px;
  }
  .tag-preference { background: #8b5cf622; color: #a78bfa; }
  .tag-fact { background: #22c55e22; color: #4ade80; }
  .tag-observation { background: #f59e0b22; color: #fbbf24; }
  .tag-decision { background: #a855f722; color: #c084fc; }
  .tag-goal { background: #06b6d422; color: #22d3ee; }

  .act-del {
    width: 18px; height: 18px; border-radius: 3px; border: none;
    background: transparent; color: var(--text-muted); font-size: 10px;
    cursor: pointer; opacity: 0; transition: all 0.12s;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .activity-item:hover .act-del { opacity: 1; }
  .act-del:hover { background: #ef444433; color: var(--red); }

  .activity-empty {
    padding: 20px 16px;
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    line-height: 1.6;
  }

  /* ── Agent List (bottom) ── */
  .agent-list-section {
    max-height: 85px;  /* ⭐ 最多3行（含默认agent） */
    overflow-y: auto;
  }
  .agent-list-section::-webkit-scrollbar { width: 3px; }
  .agent-list-section::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .agent-list-item {
    padding: 5px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.1s;
  }
  .agent-list-item:hover { background: var(--hover); }
  .agent-list-item.active { color: var(--accent); }
  .agent-li-icon { font-size: 12px; width: 18px; text-align: center; flex-shrink: 0; }
  .agent-li-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agent-li-count { font-size: 11px; color: var(--text-muted); }
  .agent-li-del {
    font-size: 11px; color: var(--text-muted); cursor: pointer;
    padding: 2px 6px; border-radius: 4px; visibility: hidden;
    transition: all 0.1s;
  }
  .agent-list-item:hover .agent-li-del { visibility: visible; }
  .agent-li-del:hover { color: var(--red); background: rgba(239,68,68,0.1); }
  .agent-list-item.active { color: var(--accent); }
  .agent-li-icon { font-size: 12px; width: 18px; text-align: center; flex-shrink: 0; }
  .agent-li-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agent-li-count { font-size: 11px; color: var(--text-muted); }

  /* ═══════ MAIN ═══════ */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .chat-hd {
    padding: 10px 20px;
    border-bottom: 1px solid var(--border-light);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .chat-hd-left { display: flex; align-items: center; gap: 8px; }
  .chat-hd-left .brand { font-size: 13px; font-weight: 600; color: var(--accent); white-space: nowrap; }
  .chat-hd-left .brand strong { font-weight: 700; }
  .chat-hd-left .sep { color: var(--border); font-size: 14px; }
  .chat-hd h1 { font-size: 14px; font-weight: 600; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-hd .badge {
    font-size: 10px; padding: 1px 6px; border-radius: 4px;
    background: var(--accent-soft); color: var(--accent);
  }
  .chat-hd-actions { display: flex; gap: 3px; }
  .chat-hd-actions button, .nav-link {
    padding: 5px 10px; border-radius: 6px;
    border: 1px solid transparent; background: transparent;
    color: var(--text-muted); font-size: 12px; cursor: pointer;
    text-decoration: none; transition: all 0.15s;
    white-space: nowrap;
  }
  .chat-hd-actions button:hover, .nav-link:hover {
    background: var(--accent-soft); color: var(--accent);
  }
  .nav-link.active {
    background: var(--accent-soft); color: var(--accent);
    border-color: var(--accent);
  }

  .chat-msgs {
    flex: 1; overflow-y: auto; padding: 20px 24px;
    display: flex; flex-direction: column; gap: 16px;
    background: radial-gradient(ellipse at 50% 0%, rgba(139,92,246,0.03) 0%, transparent 60%);
  }
  .chat-msgs::-webkit-scrollbar { width: 4px; }
  .chat-msgs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg { max-width: 80%; padding: 10px 16px; border-radius: 12px; line-height: 1.5; font-size: 14px; position: relative; animation: msgIn 0.3s ease; }
  .msg p { margin: 0 0 8px 0; }
  .msg p:last-child { margin-bottom: 0; }
  .msg br { display: inline; }
  .msg .sender {
    font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 4px; display: block;
  }
  .msg.user {
    align-self: flex-end; background: #ffffff;
    border: 1px solid var(--border); border-bottom-right-radius: 4px;
    border-left: 3px solid var(--accent);
    box-shadow: var(--msg-shadow);
  }
  .msg.user .sender { color: #a78bfa; text-align: right; }
  .msg.user .time { color: var(--text-muted); }
  .msg.user .meta { background: var(--bg); }
  .msg.agent {
    align-self: flex-start; background: var(--msg-agent-bg);
    border: 1px solid var(--msg-agent-border); border-bottom-left-radius: 4px;
    border-left: 3px solid var(--accent);
    box-shadow: var(--msg-shadow);
  }
  .msg.agent .sender { color: var(--accent); }
  .msg.agent.streaming::after {
    content: '▊'; animation: blink 0.9s step-end infinite; margin-left: 2px; color: var(--accent);
  }
  @keyframes blink { 50% { opacity: 0; } }
  .msg .time {
    font-size: 10px; color: var(--text-muted); margin-top: 4px; display: block;
    text-align: right; opacity: 0.6;
  }
  .msg .meta {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; color: var(--text-dim);
    margin-top: 6px; padding: 2px 8px; border-radius: 4px;
    background: rgba(255,255,255,0.04);
  }
  /* 代码块 — One Dark Pro 风格 */
  .msg.agent pre {
    background: #1e1e2e; color: #cdd6f4;
    border-radius: 8px; padding: 12px 14px; margin: 8px 0;
    overflow-x: auto; font-size: 13px;
    line-height: 1.5; border: 1px solid rgba(255,255,255,0.06);
    font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
  }
  .msg.agent code {
    font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
    font-size: 0.9em;
  }
  .msg.agent pre code { font-size: 13px; background: transparent; padding: 0; border: none; }
  .msg.agent :not(pre) > code {
    background: rgba(139,92,246,0.12); color: var(--accent);
    padding: 1px 6px; border-radius: 4px; font-size: 0.85em;
  }

  .typing { align-self: flex-start; display: flex; align-items: center; gap: 10px; padding: 12px 20px; }
  .typing canvas { width: 40px; height: 40px; flex-shrink: 0; }
  .typing .orb-label { font-size: 13px; color: var(--text-dim); white-space: nowrap; }

  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes brainPulse {
    0%,100% { transform: scale(1) translateY(0); opacity: 0.7; }
    50% { transform: scale(1.1) translateY(-6px); opacity: 1; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .empty-state {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text-dim); gap: 6px; user-select: none;
    padding: 20px; animation: fadeUp 0.6s ease;
  }
  .empty-state .empty-brain {
    font-size: 56px; animation: brainPulse 3s ease-in-out infinite;
    margin-bottom: 8px; filter: drop-shadow(0 4px 12px rgba(139,92,246,0.2));
  }
  .empty-state .empty-title { font-size: 15px; font-weight: 500; color: var(--text); }
  .empty-state .empty-hint { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .empty-state .empty-starters { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  .empty-state .starter-btn {
    padding: 8px 18px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-dim); font-size: 13px;
    cursor: pointer; transition: all 0.2s;
    animation: fadeUp 0.4s ease backwards;
  }
  .empty-state .starter-btn:nth-child(1) { animation-delay: 0.1s; }
  .empty-state .starter-btn:nth-child(2) { animation-delay: 0.2s; }
  .empty-state .starter-btn:nth-child(3) { animation-delay: 0.3s; }
  .empty-state .starter-btn:hover {
    border-color: var(--accent); color: var(--accent);
    background: var(--accent-soft); transform: translateY(-1px);
    box-shadow: 0 2px 8px rgba(139,92,246,0.12);
  }

  .chat-input { padding: 12px 20px 16px; border-top: 1px solid var(--border-light); flex-shrink: 0; }
  .input-row {
    display: flex; gap: 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 4px;
    transition: border-color 0.15s;
  }
  .input-row:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139,92,246,0.12); }
  .chat-input input { flex: 1; padding: 10px 12px; border: none; background: transparent; color: var(--text); font-size: 14px; outline: none; }
  .chat-input input::placeholder { color: var(--text-muted); }
  .chat-input button { padding: 8px 20px; border-radius: 8px; border: none; background: var(--accent); color: white; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .chat-input button:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 2px 8px rgba(139,92,246,0.3); }
  .chat-input button:disabled { opacity: 0.4; cursor: not-allowed; filter: none; transform: none; box-shadow: none; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 360px; }
  .modal h3 { font-size: 15px; margin-bottom: 12px; }
  .modal input { width: 100%; padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; outline: none; }
  .modal input:focus { border-color: var(--accent); }

  <div class="modal" style="width:480px;max-height:80vh;overflow-y:auto">

<script>
const KEY = 'memoryagent_v3';

function D() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY)) || {agents:{}, activeAgent:'', activeSession:''};
    // 兼容旧版本: 确保 "default" agent 存在
    if (Object.keys(d.agents).length > 0 && !d.agents['default']) {
      d.agents['default'] = { name: '默认 Agent', created: Date.now(), sessions: {} };
      d.activeAgent = 'default';
      try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e) {}
    }
    return d;
  }
  catch { return {agents:{}, activeAgent:'', activeSession:''}; }
}
function S(d) { localStorage.setItem(KEY, JSON.stringify(d)); }
function id() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// ── Agent Mgmt ──

function ensureAgent() {
  let d = D();
  if (!Object.keys(d.agents).length) {
    d.agents['default'] = { name: '默认 Agent', created: Date.now(), sessions: {} };
    d.activeAgent = 'default';
    S(d);
  } else if (!d.activeAgent || !d.agents[d.activeAgent]) {
    d.activeAgent = Object.keys(d.agents)[0];
    S(d);
  }
  return D();
}

function cycleAgent() {
  const d = D();
  // 确保 "default" agent 存在
  if (!d.agents['default']) {
    d.agents['default'] = { name: '默认 Agent', created: Date.now(), sessions: {} };
  }
  const keys = Object.keys(d.agents);
  const i = keys.indexOf(d.activeAgent);
  d.activeAgent = keys[(i + 1) % keys.length];
  d.activeSession = '';
  S(d);
  renderAll();
}

// ═══════════════════ Mobile sidebar toggle ═══════════════════
function toggleSidebar() {
  document.querySelector('.sidebar-wrap')?.classList.toggle('open');
  document.querySelector('.sidebar-overlay')?.classList.toggle('show');
}

function switchAgent(id) {
  const d = D();
  if (!d.agents['default']) {
    d.agents['default'] = { name: '默认 Agent', created: Date.now(), sessions: {} };
    S(d);
  }
  if (!d.agents[id]) return;
  d.activeAgent = id;
  d.activeSession = '';
  S(d);
  renderAll();
}

function showNewAgentModal() {
  const o = document.createElement('div');
  o.className = 'modal-overlay';
  o.innerHTML = `<div class="modal"><h3>🤖 新建项目/Agent</h3><p style="color:var(--text-muted);font-size:13px;margin-bottom:12px">每个项目拥有独立的 Agent 记忆空间，互不干扰</p><input type="text" id="new-name" placeholder="项目名称…" autofocus><div class="modal-actions"><button class="cancel" onclick="this.closest('.modal-overlay').remove()">取消</button><button class="primary" onclick="createAgent()">创建</button></div></div>`;
  document.body.appendChild(o);
  document.getElementById('new-name').focus();
  document.getElementById('new-name').onkeydown = e => { if (e.key === 'Enter') createAgent(); if (e.key === 'Escape') o.remove(); };
}

let _creating = false;  // ⭐ 防止重复创建

function createAgent() {
  if (_creating) return;  // ⭐ 防重复锁
  _creating = true;
  try {
    const name = document.getElementById('new-name').value.trim();
    if (!name) { _creating = false; return; }
    const d = D();
    const aid = 'agt_' + id();
    const sid = 'ses_' + id();
    d.agents[aid] = { name, created: Date.now(), sessions: {} };
    // ⭐ 自动创建一个空会话，避免第一枪在 sendMsg 里临时创建造成竞态
    d.agents[aid].sessions[sid] = { title: '新对话', created: Date.now(), msgs: [] };
    d.activeAgent = aid;
    d.activeSession = sid;
    S(d);
    renderAll();
    document.getElementById('msg-input')?.focus();
  } catch(e) { console.error('createAgent error:', e); }
  // ⭐ 无论是否异常，都要关弹窗+解锁
  document.querySelectorAll('.modal-overlay').forEach(el => el.remove());
  _creating = false;
}

// ── Session ──

function getSess() {
  const d = D();
  if (!d.activeAgent || !d.agents[d.activeAgent]) return null;
  const a = d.agents[d.activeAgent];
  if (!d.activeSession || !a.sessions[d.activeSession]) {
    // Don't auto-create — pick the last session, or null
    const keys = Object.keys(a.sessions);
    if (keys.length > 0) {
      d.activeSession = keys[keys.length - 1];
      S(d);
    } else {
      return null;
    }
  }
  const s = a.sessions[d.activeSession];
  return s ? { d, agent: a, agentId: d.activeAgent, sessId: d.activeSession, sess: s } : null;
}

function newChat() {
  if (_streaming) { alert('有消息正在发送，请等完成后再创建新对话'); return; }
  const d = D();
  if (!d.activeAgent || !d.agents[d.activeAgent]) return;
  const a = d.agents[d.activeAgent];
  const sid = 'ses_' + id();
  a.sessions[sid] = { title: '新对话', created: Date.now(), msgs: [] };
  d.activeSession = sid;
  S(d);
  renderAll();
  document.getElementById('msg-input')?.focus();
}

let _streaming = false;
let _streamingTimer = null;

// 🔥 v0.17: 统一隐藏 typing + 停止 orb
function _hideTyping() {
  const ty = document.getElementById('typing');
  if (ty) { ty.style.display = 'none'; if (ty.parentNode) ty.parentNode.removeChild(ty); document.querySelector('.chat-input')?.before(ty); }
  if (_orb) _orb.stop();
}

function _setStreaming(v) {
  _streaming = v;
  if (v) {
    // ⭐ 120 秒强制解锁：防止 _streaming 卡死（DeepSeek 搜索+思考可能 >30s）
    if (_streamingTimer) clearTimeout(_streamingTimer);
    _streamingTimer = setTimeout(() => {
      _streaming = false;
      document.getElementById('send-btn').disabled = false;
      console.warn('⏰ _streaming 120s 超时自动解锁');
    }, 120000);
  } else {
    if (_streamingTimer) { clearTimeout(_streamingTimer); _streamingTimer = null; }
  }
}

function switchSess(id) {
  if (id === D().activeSession) return;
  if (_streaming) { alert('有消息正在发送，请等完成后再切换对话'); return; }
  const d = D();
  d.activeSession = id;
  S(d);
  renderAll();
}

function delSess(id) {
  if (!confirm('删除此对话？')) return;
  const d = D();
  if (!d.activeAgent || !d.agents[d.activeAgent]) return;
  delete d.agents[d.activeAgent].sessions[id];
  const keys = Object.keys(d.agents[d.activeAgent].sessions);
  d.activeSession = keys.length > 0 ? keys[keys.length - 1] : '';
  S(d);
  renderAll();
}

// ── Render ──

function renderAll() {
  const d = D();
  const aid = d.activeAgent;
  const a = d.agents[aid];

  // Agent header
  document.getElementById('agent-name').textContent = a ? a.name : '无 Agent';

  // Stats from CogniMem engine
  fetch('/stats?agent_id=' + (D().activeAgent || 'default')).then(r => r.json()).then(st => {
    const total = st.total_facts || 0;
    const core = st.core_beliefs || 0;
    const ct = st.contradictions || 0;
    const byType = st.by_type || {};
    document.getElementById('st-mem').textContent = total;
    document.getElementById('st-pref').textContent = core;
    document.getElementById('st-risk').textContent = ct;
    document.getElementById('agent-status-txt').textContent =
      total > 0 ? `🧠 ${total} 条三元组 · ${core} 条信念` + (ct ? ` ⚠️ ${ct} 条矛盾` : '') : '就绪';
    renderClustersFromTypes(byType);
  }).catch(() => {});

  renderActivity();
  renderAgentList();
  renderMsgs();
  updateTitle();
  refreshTriples();
}

function renderClustersFromTypes(byType) {
  const types = { preference: { icon: '⭐', label: '偏好', color: '#8b5cf6' },
                  action: { icon: '🛠️', label: '行为', color: '#a78bfa' },
                  fact: { icon: '✅', label: '事实', color: '#22c55e' },
                  goal: { icon: '🎯', label: '目标', color: '#06b6d4' },
                  decision: { icon: '📌', label: '决策', color: '#a855f7' },
                  observation: { icon: '📝', label: '观察', color: '#f59e0b' } };
  const maxCount = Math.max(1, ...Object.values(byType));

  const list = document.getElementById('cluster-list');
  list.innerHTML = Object.entries(types).map(([t, cfg]) => {
    const c = byType[t] || 0;
    const pct = (c / maxCount * 100) || 0;
    return `<div class="cluster-item">
      <div class="cluster-icon">${cfg.icon}</div>
      <div class="cluster-name">${cfg.label}</div>
      <div class="cluster-bar"><div class="fill" style="width:${pct}%;background:${cfg.color}"></div></div>
      <div class="cluster-count">${c}</div>
    </div>`;
  }).join('');
  if (Object.keys(byType).length === 0) {
    list.innerHTML = '<div style="padding:12px;text-align:center;color:var(--text-muted);font-size:12px">暂无记忆</div>';
  }
}

function renderActivity() {
  const d = D();
  const list = document.getElementById('activity-list');
  if (!list) return;
  if (!d.activeAgent || !d.agents[d.activeAgent]) {
    list.innerHTML = '<div class="activity-empty">创建 Agent 开始</div>';
    return;
  }
  const a = d.agents[d.activeAgent];
  const entries = Object.entries(a.sessions).sort((x, y) => (y[1].created||0) - (x[1].created||0));

  if (entries.length === 0) {
    list.innerHTML = '<div class="activity-empty">还没有对话<br>点 + 开始第一个</div>';
    return;
  }

  list.innerHTML = entries.map(([id, s]) => {
    const mc = (s.msgs || []).length;
    const title = (s.title === '新对话' && s.msgs.length > 0) ? s.msgs[0].content.slice(0, 28) : s.title;
    const agentMsgs = (s.msgs || []).filter(m => m.role === 'agent').length;
    return `<div class="activity-item ${id === d.activeSession ? 'active' : ''}" onclick="switchSess('${id}')">
      <div class="activity-emoji">💬</div>
      <div class="activity-body">
        <div class="activity-text">${esc(title || '新对话')}</div>
        <div class="activity-meta">
          <span>${mc} 条</span>
          <span class="activity-tag" style="background:#22c55e22;color:#4ade80">+${agentMsgs * 2 || 1} 记忆</span>
        </div>
      </div>
      <button class="act-del" onclick="event.stopPropagation();delSess('${id}')">✕</button>
    </div>`;
  }).join('');
}

function renderAgentList() {
  const d = D();
  const list = document.getElementById('agent-list-section');
  list.innerHTML = Object.entries(d.agents).map(([id, a]) =>
    `<div class="agent-list-item ${id === d.activeAgent ? 'active' : ''}" onclick="switchAgent('${id}')">
      <div class="agent-li-icon">🧠</div>
      <div class="agent-li-name">${esc(a.name)}</div>
      <div class="agent-li-count">${Object.keys(a.sessions||{}).length}</div>
      <span class="agent-li-del" onclick="event.stopPropagation();deleteAgent('${id}',${jesc(a.name)})" title="移除项目">🗑️</span>
    </div>`
  ).join('');
}

function fmtTime(ts) {
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function renderMsgs() {
  const container = document.getElementById('chat-msgs');
  const emp = document.getElementById('empty-state');
  container.innerHTML = '';

  const r = getSess();
  if (!r || !r.sess || !r.sess.msgs || !r.sess.msgs.length) {
    container.appendChild(emp);
    return;
  }
  r.sess.msgs.forEach(m => {
    const d = document.createElement('div');
    d.className = 'msg ' + m.role;
    const sender = document.createElement('span');
    sender.className = 'sender';
    if (m.role === 'user') sender.textContent = '我'; else sender.style.display = 'none';
    d.appendChild(sender);
    const text = document.createElement('div');
    if (m.role === 'agent') text.innerHTML = md(m.content);
    else text.textContent = m.content;
    d.appendChild(text);
    if (m.meta) {
      const x = document.createElement('span');
      x.className = 'meta';
      x.textContent = m.meta;
      d.appendChild(x);
    }
    const t = document.createElement('span');
    t.className = 'time';
    t.textContent = fmtTime(m.time || Date.now());
    d.appendChild(t);
    container.appendChild(d);
  });
  scrollB();
}

  document.getElementById('chat-msgs').scrollTop = 999999;
}

// ⭐ 普通 POST 发送（streaming 降级用）
function _postChat(r, body) {
  fetch('/chat', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body,
  })
  .then(res => {
    if (!res.ok) throw new Error(res.status === 503 ? 'API Key 未配置' : '请求失败');
    return res.json();
  })
  .then(data => {
    const ty = document.getElementById('typing');
    _hideTyping();

    const d2 = D();
    const s2 = d2.agents[r.agentId]?.sessions?.[r.sessId];
    if (s2) {
      s2.msgs.push({role: 'agent', content: data.reply, time: Date.now(), meta: 'none'});
      S(d2);
    }

    const ad = document.createElement('div');
    ad.className = 'msg agent';
    let dHtml = '<div>' + esc(data.reply) + '</div>';
    if (data.tool_sequence && data.tool_sequence.length > 0) {
      const steps = data.tool_sequence.map(function(s) { return '🛠️ ' + esc(s); }).join('<br>');
      dHtml = '<div style="font-size:12px;color:#666;padding:6px 10px;background:#f7f8fa;border-radius:6px;margin-bottom:8px">' + steps + '</div>' + dHtml;
    }
    ad.innerHTML = dHtml;
    if (data.tools_called > 0) {
      const m = document.createElement('span'); m.className = 'meta'; m.textContent = '🛠️ ' + data.tools_called + ' 次工具调用 🔄 ' + (data.iterations || 0) + ' 轮思考';
      ad.appendChild(m);
    } else if (data.new_memories_stored > 0) {
      const m = document.createElement('span'); m.className = 'meta'; m.textContent = '📚 ' + (data.memories_used || 0) + ' 引用 🧠 +' + data.new_memories_stored;
      ad.appendChild(m);
    }
    const t = document.createElement('span'); t.className = 'time'; t.textContent = fmtTime(Date.now());
    ad.appendChild(t);
    document.getElementById('chat-msgs').appendChild(ad);
    scrollB();
    document.getElementById('send-btn').disabled = false;
    _streaming = false;
    refreshSidebar();
  })
  .catch(err => {
    _streaming = false;
    const ty = document.getElementById('typing');
    _hideTyping();
    const dX = D();
    const sX = dX.agents[r.agentId]?.sessions?.[r.sessId];
    if (sX) {
      sX.msgs.push({role: 'agent', content: '⚠️ 请求失败: ' + err.message, time: Date.now()});
      S(dX);
    }
    const ed = document.createElement('div');
    ed.className = 'msg agent';
    ed.innerHTML = '<div>❌ ' + esc(err.message) + '</div>';
    document.getElementById('chat-msgs').appendChild(ed);
    document.getElementById('send-btn').disabled = false;
  });
}

function sendMsg() {
  const inp = document.getElementById('msg-input');
  const text = inp.value.trim();
  if (!text) return;

  // 如果 _streaming 卡死，二次点击发送可强制重置
  if (_streaming) {
    if (confirm('检测到消息未完成发送，是否重置后重新发送？')) {
      _streaming = false;
      document.getElementById('send-btn').disabled = false;
    } else {
      return;
    }
  }

  inp.value = '';
  document.getElementById('send-btn').disabled = true;
  _setStreaming(true);

  let r = getSess();
  if (!r) {
    // Auto-create a session if none exists
    _streaming = false;  // ⭐ 临时解锁以创建新会话
    newChat();
    _setStreaming(true);
    r = getSess();
    if (!r) { _streaming = false; document.getElementById('send-btn').disabled = false; return; }
  }

  r.sess.msgs.push({role: 'user', content: text, time: Date.now()});
  if (r.sess.title === '新对话' && r.sess.msgs.length === 1) r.sess.title = text.slice(0, 40);
  if (!r.sess.created) r.sess.created = Date.now();
  S(r.d);

  renderActivity();
  updateTitle();
  document.getElementById('empty-state')?.remove();
  const ud = document.createElement('div');
  ud.className = 'msg user';
  ud.innerHTML = '<span class="sender">我</span><div>' + esc(text) + '</div><span class="time">' + fmtTime(Date.now()) + '</span>';
  document.getElementById('chat-msgs').appendChild(ud);
  scrollB();

  const ty = document.getElementById('typing');
  ty.style.display = 'flex';
  document.getElementById('chat-msgs').appendChild(ty);
  if (_orb) _orb.start('working');
  scrollB();

  // 传全部历史消息（后端自己控制保留多少条）
  const body = JSON.stringify({agent_id: r.agentId, session_id: r.sessId, message: text, messages: r.sess.msgs.map(m => ({role: m.role, content: m.content}))});

  // Try streaming first
  fetch('/chat/stream', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body,
  })
  .then(res => {
    if (!res.ok) { _streaming = false; throw new Error(res.status === 503 ? 'API Key 未配置' : '请求失败'); }

    // Remove typing indicator, create streaming message element
    _hideTyping();

    const ad = document.createElement('div');
    ad.className = 'msg agent streaming';
    ad.innerHTML = '<div class="stream-content"></div><span class="time">' + fmtTime(Date.now()) + '</span>';
    document.getElementById('chat-msgs').appendChild(ad);
    document.getElementById('send-btn').disabled = false;
    scrollB();

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';
    let _firstTokenTimer = null;
    _firstTokenTimer = setTimeout(() => {
      if (!fullText && _streaming) {
        _streaming = false;
        try { reader.cancel(); } catch(e) {}
        _hideTyping();
        try { ad.remove(); } catch(e) {}
        if (_streamingTimer) { clearTimeout(_streamingTimer); _streamingTimer = null; }
        // 首 token 超时 → 降级到普通 POST /chat
        // ⭐ 25s 窗口：容纳后端 15s keepalive 间隔 + 缓冲
        _postChat(r, body);
      }
    }, 25000);

    function readStream() {
      reader.read().then(({done, value}) => {
        if (done) {
          if (_firstTokenTimer) clearTimeout(_firstTokenTimer);
          _streaming = false;
          // ⭐ 空响应保护：stream 完成但没内容 → 降级到 POST
          if (!fullText.trim()) {
            try { ad.remove(); } catch(e) {}
            if (_streamingTimer) { clearTimeout(_streamingTimer); _streamingTimer = null; }
            _postChat(r, body);
            return;
          }
          const d3 = D();
          const s3 = d3.agents[r.agentId]?.sessions?.[r.sessId];
          if (s3) {
            s3.msgs.push({role: 'agent', content: fullText, time: Date.now()});
            S(d3);
          }
          ad.classList.remove('streaming');
          ad.className = 'msg agent';
          const contentDiv = ad.querySelector('.stream-content') || ad;
          contentDiv.innerHTML = md(fullText);
          document.getElementById('send-btn').disabled = false;
          scrollB();
          refreshSidebar();
          return;
        }

        const chunk = decoder.decode(value, {stream: true});
        const lines = chunk.split('\n');
        for (const line of lines) {
          if (line.startsWith('data: ')) {
            try {
              const data = JSON.parse(line.slice(6));
              // ⭐ 收到任何事件都重置首 token 超时计时器（25s 匹配后端 keepalive 间隔）
              if (_firstTokenTimer) { clearTimeout(_firstTokenTimer); }
              _firstTokenTimer = setTimeout(() => {
                if (!fullText && _streaming) {
                  _streaming = false;
                  try { reader.cancel(); } catch(e) {}
                  _hideTyping();
                  try { ad.remove(); } catch(e) {}
                  if (_streamingTimer) { clearTimeout(_streamingTimer); _streamingTimer = null; }
                  _postChat(r, body);
                }
              }, 25000);
              if (data.type === 'token') {
                fullText += data.content;
                const cd = ad.querySelector('.stream-content');
                if (cd) cd.textContent = fullText; else ad.textContent = fullText;
                scrollB();
              } else if (data.type === 'narration' || data.type === 'orb_state') {
                // 🔥 v0.17: narration 更新 orb 状态
                const text = data.content || '';
                if (_orb) {
                  const orbState = data.type === 'orb_state' ? text : _narrationToOrbState(text);
                  if (orbState) _orb.start(orbState);
                }
                // also update label in the <streaming> typing area
                const orbLabel = document.getElementById('orb-label');
                if (orbLabel && data.type === 'narration') orbLabel.textContent = text;
              } else if (data.type === 'meta') {
                // 元数据展示（工具调用数等）
                const cd = ad.querySelector('.stream-content') || ad;
                const metaEl = document.createElement('div');
                metaEl.className = 'meta';
                metaEl.textContent = data.content;
                cd.parentNode.appendChild(metaEl);
              } else if (data.type === 'error') {
                const cd = ad.querySelector('.stream-content') || ad;
                cd.textContent = '❌ ' + data.content;
              }
            } catch(e) { /* ignore parse errors */ }
          }
        }
        readStream();
      }).catch(err => {
        _streaming = false;
        // 保存部分内容和错误到对话历史
        const dR = D();
        const sR = dR.agents[r.agentId]?.sessions?.[r.sessId];
        if (sR && fullText) {
          sR.msgs.push({role: 'agent', content: fullText + '\n\n[⚠️ 输出中断: ' + err.message + ']', time: Date.now()});
          S(dR);
        }
        const cd = ad.querySelector('.stream-content') || ad;
        cd.textContent = '❌ 流式读取失败: ' + err.message;
      });
    }
    readStream();
  })
  .catch(() => {
    _streaming = false;
    // Remove the empty streaming div if it was created (avoids blank bubbles)
    try { ad.remove(); } catch(e) {}
    // Streaming failed — fall back to regular POST /chat
    fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body,
    })
    .then(res => {
      if (!res.ok) throw new Error(res.status === 503 ? 'API Key 未配置' : '请求失败');
      return res.json();
    })
    .then(data => {
      _streaming = false;
      _hideTyping();

      const d2 = D();
      const s2 = d2.agents[r.agentId]?.sessions?.[r.sessId];
      if (s2) {
        s2.msgs.push({role: 'agent', content: data.reply, time: Date.now(), meta: 'none'});
        S(d2);
      }

      const ad = document.createElement('div');
      ad.className = 'msg agent';
      let dHtml = '<div>' + esc(data.reply) + '</div>';
      if (data.tool_sequence && data.tool_sequence.length > 0) {
        const steps = data.tool_sequence.map(function(s) { return '🛠️ ' + esc(s); }).join('<br>');
        dHtml = '<div style="font-size:12px;color:#666;padding:6px 10px;background:#f7f8fa;border-radius:6px;margin-bottom:8px">' + steps + '</div>' + dHtml;
      }
      ad.innerHTML = dHtml;
      if (data.tools_called > 0) {
        const m = document.createElement('span');
        m.className = 'meta';
        m.textContent = '🛠️ ' + data.tools_called + ' 次工具调用 🔄 ' + (data.iterations || 0) + ' 轮思考';
        ad.appendChild(m);
      } else if (data.new_memories_stored > 0) {
        const m = document.createElement('span');
        m.className = 'meta';
        m.textContent = '📚 ' + (data.memories_used || 0) + ' 引用 🧠 +' + data.new_memories_stored;
        ad.appendChild(m);
      }
      const t = document.createElement('span');
      t.className = 'time';
      t.textContent = fmtTime(Date.now());
      ad.appendChild(t);
      document.getElementById('chat-msgs').appendChild(ad);
      scrollB();
      document.getElementById('send-btn').disabled = false;
      refreshSidebar();
    })
    .catch(err => {
      _streaming = false;
      _hideTyping();
      // 保存错误到对话历史，保证下一轮能看到
      const dX = D();
      const sX = dX.agents[r.agentId]?.sessions?.[r.sessId];
      if (sX) {
        sX.msgs.push({role: 'agent', content: '⚠️ 请求失败: ' + err.message, time: Date.now()});
        S(dX);
      }
      const ed = document.createElement('div');
      ed.className = 'msg agent';
      ed.innerHTML = '<div>❌ ' + esc(err.message) + '</div>';
      document.getElementById('chat-msgs').appendChild(ed);
      document.getElementById('send-btn').disabled = false;
    });
  });
}

  document.getElementById('fact-evidence').innerHTML = '';

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
// ⭐ 安全内插到 JS 字符串字面量（onclick 属性）
function jesc(s) { return "'" + String(s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/</g, '\\x3C').replace(/>/g, '\\x3E') + "'"; }

// Simple markdown rendering for AI responses
// Splits into paragraphs, applies inline formatting, wraps each block.
function md(s) {
  if (!s) return '';

  // 1. Escape HTML, then protect code blocks
  let h = esc(s)
    .replace(/```(\w*)\n?([\s\S]*?)```/g, '◀CODE▶$2◀/CODE▶')
    .replace(/`([^`]+)`/g, '◀CODE▶$1◀/CODE▶');

  // 2. Apply inline formatting
  h = h
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  // 3. Split into blocks by double (or more) newlines
  const blocks = h.split(/\n{2,}/);
  const out = [];

  for (let block of blocks) {
    block = block.trim();
    if (!block) continue;

    // Restore code blocks with proper tags
    const hasCode = block.includes('◀CODE▶');
    const renderBlock = (b) => {
      let r = b
        .replace(/◀CODE▶([\s\S]*?)◀\/CODE▶/g, (_, c) => {
          // Check if it's multi-line (pre) or inline (code)
          if (c.includes('\n')) return '<pre><code>' + esc(c) + '</code></pre>';
          else return '<code>' + esc(c) + '</code>';
        })
        // Single newline within block -> <br>
        .replace(/\n/g, '<br>');
      return r;
    };

    // Detect block type
    const firstLine = block.split('\n')[0].trim();

    if (/^#{1,3}\s/.test(firstLine)) {
      // Header
      const level = firstLine.match(/^(#{1,3})\s/)[1].length;
      const tag = 'h' + (level + 1); // h2, h3, h4
      const text = firstLine.replace(/^#{1,3}\s+/, '');
      const rest = block.replace(firstLine, '').trim();
      let html = `<${tag}>${text}</${tag}>`;
      if (rest) html += renderBlock(rest);
      out.push(html);
    } else if (/^[\s]*[-*]\s/.test(firstLine) || /^[\s]*\d+\.\s/.test(firstLine)) {
      // List
      const items = block.split('\n').map(line => {
        const content = line.replace(/^[\s]*[-*]\s+/, '').replace(/^[\s]*\d+\.\s+/, '');
        return '<li>' + content + '</li>';
      }).join('');
      out.push('<ul>' + items + '</ul>');
    } else {
      // Regular paragraph
      out.push('<p>' + renderBlock(block) + '</p>');
    }
  }

  return out.join('');
}

// ════════════════════════════════════════════════════════════
//  🔥 v0.18: CogniOrb 2.0 — 对标 thinking-orbs ⭐1,032
//  6 种状态，每状态独立色系 + glow 光晕 + 过渡 morph 动画
//  96px@2x Canvas，自动暗色/亮色模式，离屏暂停
// ════════════════════════════════════════════════════════════

const STATE_COLORS = {
  working:   { p: '#8b5cf6', g: 'rgba(139,92,246,0.15)', d: 'rgba(139,92,246,0.35)' },
  searching: { p: '#3b82f6', g: 'rgba(59,130,246,0.15)', d: 'rgba(59,130,246,0.35)' },
  solving:   { p: '#10b981', g: 'rgba(16,185,129,0.15)', d: 'rgba(16,185,129,0.35)' },
  listening: { p: '#06b6d4', g: 'rgba(6,182,212,0.15)', d: 'rgba(6,182,212,0.35)' },
  composing: { p: '#f59e0b', g: 'rgba(245,158,11,0.15)', d: 'rgba(245,158,11,0.35)' },
  shaping:   { p: '#ec4899', g: 'rgba(236,72,153,0.15)', d: 'rgba(236,72,153,0.35)' },
};

class CogniOrb {
  constructor(canvasId, labelId) {
    this.canvas = document.getElementById(canvasId);
    this.label = document.getElementById(labelId);
    this.ctx = this.canvas.getContext('2d');
    this.size = 72;
    // 状态
    this.state = 'working';
    this._prevState = null;
    this._transitionT = 0;    // 0→1 morph 进度
    this._morphing = false;
    this.frameId = null;
    this.time = 0;
    this.paused = false;
    this._themeMedia = window.matchMedia('(prefers-color-scheme: dark)');

    // 离屏自动暂停
    this._observer = new IntersectionObserver(([e]) => {
      this.paused = !e.isIntersecting;
      if (!this.paused && !this.frameId && this._running) this._animate();
    }, { threshold: 0 });
    this._observer.observe(this.canvas);
    document.addEventListener('visibilitychange', () => {
      this.paused = document.hidden;
      if (!this.paused && !this.frameId && this._running) this._animate();
    });

    this._running = false;
  }

  // ── 状态颜色 ──
  _sc() { return STATE_COLORS[this.state] || STATE_COLORS.working; }
  _scPrev() { return STATE_COLORS[this._prevState] || STATE_COLORS.working; }
  _blend(a, b, t) {
    if (!b) return a;
    const lerp = (x, y) => x.map((v, i) => Math.round(v + (y[i] - v) * t));
    const pa = a.match(/rgba?\((\d+),(\d+),(\d+)(?:,([\d.]+))?\)/);
    const pb = b.match(/rgba?\((\d+),(\d+),(\d+)(?:,([\d.]+))?\)/);
    if (!pa || !pb) return t < 0.5 ? a : b;
    const ca = [parseInt(pa[1]), parseInt(pa[2]), parseInt(pa[3]), parseFloat(pa[4]||'1')];
    const cb = [parseInt(pb[1]), parseInt(pb[2]), parseInt(pb[3]), parseFloat(pb[4]||'1')];
    const cm = lerp(ca, cb);
    return `rgba(${cm[0]},${cm[1]},${cm[2]},${cm[3]})`;
  }
  _col(alpha) {
    const c = this._sc();
    const base = this._isDark() ? `rgba(220,220,240,${alpha||0.85})` : c.p;
    if (!this._morphing || !this._prevState) return this._isDark() ? base : `rgba(${parseInt(c.p.slice(1,3),16)},${parseInt(c.p.slice(3,5),16)},${parseInt(c.p.slice(5,7),16)},${alpha||0.8})`;
    const prev = this._scPrev();
    const t = this._transitionT;
    const r = Math.round(parseInt(c.p.slice(1,3),16)*t + parseInt(prev.p.slice(1,3),16)*(1-t));
    const g = Math.round(parseInt(c.p.slice(3,5),16)*t + parseInt(prev.p.slice(3,5),16)*(1-t));
    const b = Math.round(parseInt(c.p.slice(5,7),16)*t + parseInt(prev.p.slice(5,7),16)*(1-t));
    return `rgba(${r},${g},${b},${alpha||0.8})`;
  }
  _colDim(alpha) {
    const c = this._sc();
    if (this._isDark()) return `rgba(180,180,200,${alpha||0.3})`;
    if (!this._morphing || !this._prevState) return `rgba(${parseInt(c.p.slice(1,3),16)},${parseInt(c.p.slice(3,5),16)},${parseInt(c.p.slice(5,7),16)},${alpha||0.35})`;
    const prev = this._scPrev();
    const t = this._transitionT;
    const r = Math.round(parseInt(c.p.slice(1,3),16)*t + parseInt(prev.p.slice(1,3),16)*(1-t));
    const g = Math.round(parseInt(c.p.slice(3,5),16)*t + parseInt(prev.p.slice(3,5),16)*(1-t));
    const b = Math.round(parseInt(c.p.slice(5,7),16)*t + parseInt(prev.p.slice(5,7),16)*(1-t));
    return `rgba(${r},${g},${b},${alpha||0.35})`;
  }

  // ── 状态文本映射 ──
  _stateLabel(s) {
    const m = {
      working: '处理中…', searching: '搜索中…', solving: '分析中…',
      listening: '等待输入…', composing: '生成中…', shaping: '构思中…',
    };
    return m[s] || '思考中…';
  }

  // ── 启动/切换状态 ──
  start(state) {
    if (state && state !== this.state) {
      // 记录上一状态，启动 morph 过渡
      this._prevState = this.state;
      this.state = state;
      this._transitionT = 0;
      this._morphing = true;
      if (this.label) this.label.textContent = this._stateLabel(state);
    }
    this._running = true;
    if (this._morphing) this.time = 0;  // 保持动画连续
    else this.time = 0;
    if (!this.paused && !this.frameId) this._animate();
  }

  stop() {
    this._running = false;
    this._morphing = false;
    this._prevState = null;
    if (this.frameId) { cancelAnimationFrame(this.frameId); this.frameId = null; }
    this.ctx.clearRect(0, 0, this.size, this.size);
  }

  // ── 光晕绘制（每帧先画） ──
  _drawGlow(t) {
    const c = this._sc();
    const cx = this.size/2, cy = this.size/2;
    const pulse = 0.85 + 0.15 * Math.sin(t * 0.04);
    const r = 22 * pulse;
    const grad = this.ctx.createRadialGradient(cx, cy, 2, cx, cy, r);
    const col = this._morphing && this._prevState
      ? this._blend(this._scPrev().g, c.g, this._transitionT)
      : c.g;
    grad.addColorStop(0, col);
    grad.addColorStop(1, 'transparent');
    this.ctx.fillStyle = grad;
    this.ctx.beginPath();
    this.ctx.arc(cx, cy, r, 0, Math.PI*2);
    this.ctx.fill();
  }

  // ── 动画循环 ──
  _animate() {
    if (this.paused || !this._running) { this.frameId = null; return; }
    this.time += 1;
    // morph 过渡：30 帧完成
    if (this._morphing) {
      this._transitionT = Math.min(1, this._transitionT + 0.05);
      if (this._transitionT >= 1) { this._morphing = false; this._prevState = null; }
    }
    this.ctx.clearRect(0, 0, this.size, this.size);
    this._drawGlow(this.time);
    this[`_draw_${this.state}`](this.time);
    this.frameId = requestAnimationFrame(() => this._animate());
  }

  // ── 6 种状态绘制（均已升级颜色+光晕） ──

  // working: 粒子沿倾斜轨道旋转（紫色）
  _draw_working(t) {
    const cx = 36, cy = 36;
    const count = 8;
    const col = this._col(), colD = this._colDim();
    for (let i = 0; i < count; i++) {
      const angle = (i / count) * Math.PI * 2 + t * 0.03;
      const tilt = 0.4;
      const rx = 20, ry = 8;
      const x = cx + Math.cos(angle) * rx;
      const y = cy + Math.sin(angle) * ry + Math.cos(angle * 2) * tilt * ry;
      const alpha = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(angle - t * 0.05));
      this._dot(x, y, 3 + 2 * alpha, this._col(0.5 + 0.4 * alpha));
    }
    // 轨道
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const x = cx + Math.cos(a) * 20;
      const y = cy + Math.sin(a) * 8 + Math.cos(a * 2) * 0.4 * 8;
      this._dot(x, y, 1.5, colD);
    }
  }

  // searching: 扫描子午线扫过点状地球（蓝色）
  _draw_searching(t) {
    const cx = 36, cy = 36, col = this._col(), colD = this._colDim();
    // 点状球体
    for (let i = 0; i < 20; i++) {
      const lat = (i / 20) * Math.PI - Math.PI / 2;
      for (let j = 0; j < 10; j++) {
        const lon = (j / 10) * Math.PI * 2 + t * 0.01;
        const rx = 18 * Math.cos(lat);
        const ry = 18 * Math.sin(lat);
        const x = cx + Math.cos(lon) * rx;
        const y = cy + Math.sin(lon) * ry;
        const z = Math.sin(lon) * rx;
        if (z > 0) {
          const alpha = 0.3 + 0.7 * (z / 18);
          this._dot(x, y, 2 * alpha, this._colDim(0.2 + 0.4 * alpha));
        }
      }
    }
    // 扫描线
    const scan = (t * 0.04) % (Math.PI * 2);
    for (let i = -20; i <= 20; i++) {
      const lat2 = (i / 40) * Math.PI;
      const x2 = cx + Math.cos(scan + lat2 * 0.5) * 18;
      const y2 = cy + Math.sin(lat2) * 7 + Math.cos(scan) * 3;
      if (x2 > cx - 18 && x2 < cx + 18) {
        this._dot(x2, y2, 2.5 + 0.5 * Math.sin(t * 0.06), col);
      }
    }
  }

  // solving: 条码归位（绿色）
  _draw_solving(t) {
    const cx = 36, cy = 36;
    const count = 10;
    const phase = (t * 0.05) % 1;
    const col = this._col();
    for (let i = 0; i < count; i++) {
      const targetX = cx - 20 + (i / (count - 1)) * 40;
      const offset = Math.sin(t * 0.02 + i * 2) * (1 - phase) * 20;
      const x = targetX + offset;
      const h = 10 + Math.sin(i * 1.5) * 6;
      const y = cy - h / 2;
      const alpha = 0.4 + 0.6 * (1 - Math.abs(offset) / 20);
      this._rect(x - 2, y, 4, h, this._col(0.4 + 0.5 * alpha));
    }
  }

  // listening: 波形滚过环状轨道（青色）
  _draw_listening(t) {
    const cx = 36, cy = 36, col = this._col(), colD = this._colDim();
    const r = 16;
    // 环
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      this._dot(x, y, 2, colD);
    }
    // 波形
    const waveCount = 6;
    for (let i = 0; i < waveCount; i++) {
      const angle = (i / waveCount) * Math.PI * 2 + t * 0.04;
      const wave = Math.sin(angle * 3 + t * 0.08) * 6;
      const x = cx + Math.cos(angle) * (r + wave * 0.5);
      const y = cy + Math.sin(angle) * (r + wave * 0.5);
      this._dot(x, y, 3 + wave * 0.3, col);
    }
  }

  // composing: 多段波形起伏（橙色）
  _draw_composing(t) {
    const cx = 36, cy = 36;
    for (let band = 0; band < 3; band++) {
      const bandY = cy - 12 + band * 12;
      const freq = 2 + band * 0.5;
      const speed = 0.03 + band * 0.01;
      for (let i = 0; i <= 20; i++) {
        const x = cx - 20 + (i / 20) * 40;
        const wave = Math.sin(i * freq * 0.3 + t * speed) * 5;
        const y = bandY + wave;
        const alpha = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(i * 0.5 + t * 0.02 + band));
        this._dot(x, y, 2.5 * alpha, this._col(0.3 + 0.5 * alpha));
      }
    }
  }

  // shaping: 轮廓变形（圆→三角→方）（粉色）
  _draw_shaping(t) {
    const cx = 36, cy = 36, col = this._col(), colD = this._colDim();
    const morph = (Math.sin(t * 0.02) + 1) / 2;
    const count = 16;
    for (let i = 0; i < count; i++) {
      const baseAngle = (i / count) * Math.PI * 2;
      let r;
      if (morph < 0.5) {
        const t2 = morph * 2;
        const triR = 14 * (1 + 0.3 * Math.cos(baseAngle * 3));
        r = 14 * (1 - t2) + triR * t2;
      } else {
        const t2 = (morph - 0.5) * 2;
        const sqR = 14 / Math.max(0.01, Math.cos(baseAngle % (Math.PI / 2) - Math.PI / 4));
        const triR = 14 * (1 + 0.3 * Math.cos(baseAngle * 3));
        r = triR * (1 - t2) + sqR * t2;
      }
      r = Math.min(r, 18);
      const x = cx + Math.cos(baseAngle) * r;
      const y = cy + Math.sin(baseAngle) * r;
      const alpha = 0.5 + 0.5 * (0.5 + 0.5 * Math.sin(i + t * 0.05));
      this._dot(x, y, 2.5 * alpha, this._col(0.3 + 0.5 * alpha));
    }
  }

  // ── 基础绘制 ──
  _dot(x, y, r, color) {
    this.ctx.beginPath();
    this.ctx.arc(x, y, Math.max(0.5, r), 0, Math.PI * 2);
    this.ctx.fillStyle = color;
    this.ctx.fill();
  }

  _rect(x, y, w, h, color) {
    this.ctx.fillStyle = color;
    this.ctx.fillRect(x, y, w, h);
  }
}
